properties:
  rdy-gpios:
    type: phandle-array
    description: "Data Ready pin for the Azoteq IQS5xx trackpad"
  
  reset-gpios:
    type: phandle-array
    description: "Reset pin for the Azoteq IQS5xx trackpad"

  one-finger-tap:
    type: boolean
    description: "Register single finger tap gestures and report them as a left click"

  press-and-hold:
    type: boolean
    description: "Register press and hold gestures and report them as a left click until released"
  
  press-and-hold-time:
    type: int
    description: "Time in ms (in addition to the tap time) it takes to register a press and hold gesture"
    default: 250

  two-finger-tap:
    type: boolean
    description: "Register two finger tap gestures and report them as a right click"
  
  scroll:
    type: boolean
    description: "Register and report scroll gestures, both vertical and horizontal scroll is supported"

  natural-scroll-x:
    type: boolean
    description: "Whether content should track finger movement when scrolling on the x axis."

  natural-scroll-y:
    type: boolean
    description: "Whether content should track finger movement when scrolling on the y axis."

  switch-xy:
    type: boolean
    description: "Flip x and y axes"
  
  flip-x:
    type: boolean
    description: "Invert the direction of the x axis"

  flip-y:
    type: boolean
    description: "Invert the direction of the y axis"

  bottom-beta:
    type: int
    description: |
      Amount of filtering applied at slow speeds.
      0: Most filtering, smoother, but laggier.
      255: Least filtering, least smooth, more responsive.
    default: 5
  
  stationary-threshold:
    type: int
    description: |
      How far a finger must move (in pixels) to not be considered stationary.
    default: 5

  report-rate-active-ms:
    type: int
    description: |
      Active-mode report rate in milliseconds — written to register 0x057A.
      Lower = higher polling rate = smaller per-sample deltas = smoother tracking
      under fast motion (fewer "straight line" gaps between widely-spaced samples).
      Chip default 10 (100Hz). Set to 0 to skip the register write and leave the
      chip at whatever it last had. 5ms (200Hz) is the practical floor for the
      IQS572 — going faster risks the chip not finishing its sense cycle in time.
    default: 10

  report-rate-idle-touch-ms:
    type: int
    description: |
      Idle-touch report rate (register 0x057C). Used by the chip when finger
      is stationary on the pad. Set equal to active rate to avoid filter
      discontinuity when finger transitions between moving and resting.
      Set to 0 to leave at chip default.
    default: 10

  report-rate-idle-ms:
    type: int
    description: |
      Idle-mode report rate (register 0x057E). Used when no finger present.
      Match active rate to keep the chip ready for first-touch responsiveness.
      Set to 0 to leave at chip default.
    default: 10

  disable-idle-timeout:
    type: boolean
    description: |
      When true, writes 0xFF to IDLE_MODE_TIMEOUT (register 0x0586) which
      datasheet §4.2 specifies as "never timeout" — chip stays in active/idle
      modes and never enters LP1/LP2 sleep states. Prevents filter-state
      discontinuity that surfaces as "first touch after pause feels sluggish."
      Default true (matches QMK upstream / holykeebs behavior).

  palm-reject:
    type: boolean
    description: |
      Enable chip-side palm rejection (XY_CONFIG_0 bit 3 / register 0x0669).
      When set, chip suppresses XY output for any contact whose touch area
      exceeds the palm-reject threshold (register 0x066B). Datasheet §5.5.
      Default true (matches QMK upstream / holykeebs behavior).

  reati:
    type: boolean
    description: |
      Enable autonomous Re-ATI (capacitive baseline recalibration) on the
      trackpad and ALP channels. SYSTEM_CONFIG_0 bits 2 and 3 (REATI +
      ALP_REATI). Without this, chip does not re-calibrate baseline drift
      while a finger is present — symptom is "long touches gradually lose
      sensitivity until release." Datasheet §3.7.2.
      Default true (matches Linux mainline + QMK upstream behavior).
